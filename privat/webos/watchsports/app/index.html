<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>WatchSports</title>
<link rel="stylesheet" href="css/app.css">
<script src="js/app.js"></script>
</head>
<body>
<div id="backdrop"><div class="bd-logos"><img class="bd-a" alt=""><img class="bd-b" alt=""></div></div>
<header id="top">
	<div class="logo">WATCH<b>SPORTS</b></div>
	<div id="status"></div>
	<div id="clock"></div>
</header>
<section id="hero">
	<div class="h-badges"><span class="h-live">ÉLŐ</span><span class="h-sport"></span><span class="h-time"></span></div>
	<h1 class="h-title"></h1>
	<div class="h-detail"></div>
	<div class="h-teams"></div>
	<div class="h-actions">
		<span class="btn btn-play">▶&nbsp; Adások</span>
		<span class="btn btn-info">ⓘ&nbsp; <span class="h-streams"></span></span>
	</div>
</section>
<main id="rows"><div class="rows-inner"></div></main>
<div id="detail">
	<div class="d-panel">
		<div class="d-head">
			<div class="d-logos"></div>
			<div class="d-text">
				<div class="d-badges"></div>
				<h2 class="d-title"></h2>
				<div class="d-meta"></div>
			</div>
		</div>
		<h3>Adások</h3>
		<div class="d-list"></div>
		<div class="d-help">▲▼ lépés · OK megnyitás az appban · <span class="red">●</span> piros gomb: TV böngészője · Vissza: bezárás</div>
	</div>
</div>
<div id="loading"><div class="spinner"></div></div>
<div id="toast"></div>
</body>
</html>
